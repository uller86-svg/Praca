plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.niezgodnosci.app'
    compileSdk 34

    defaultConfig {
        applicationId 'pl.niezgodnosci.app'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
